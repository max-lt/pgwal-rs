[workspace]
resolver = "3"
members = ["crates/pgwal", "crates/pgwal-receiver", "crates/pgwal-cli"]
# Built for wasm32 with worker-build, outside of the native workspace.
exclude = ["crates/pgwal-worker"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/max-lt/pgwal-rs"
readme = "README.md"

[workspace.dependencies]
pgwal = { path = "crates/pgwal", version = "0.3.0" }
pgwal-receiver = { path = "crates/pgwal-receiver", version = "0.3.0" }
tokio = { version = "1.52", default-features = false }
bytes = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
tempfile = "3"
tokio-postgres = "0.7"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
webpki-roots = "1"
rcgen = "0.13"
