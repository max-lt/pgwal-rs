[workspace]
resolver = "3"
members = ["crates/pgwal", "crates/pgwal-receiver", "crates/pgwal-cli"]
# Built for wasm32 with worker-build, outside of the native workspace.
exclude = ["crates/pgwal-worker"]

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/max-lt/pgwal-rs"
readme = "README.md"

[workspace.dependencies]
pgwal = { path = "crates/pgwal", version = "0.5.2" }
pgwal-receiver = { path = "crates/pgwal-receiver", version = "0.5.2" }
tokio = { version = "1.52", default-features = false }
bytes = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
tempfile = "3"
tokio-postgres = "0.7"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "logging", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
quick-xml = { version = "0.41", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
rcgen = "0.13"
