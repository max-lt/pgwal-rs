[package]
name = "pgwal-receiver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Streams the WAL of a Postgres server over physical replication and uploads it by LSN range."

[features]
default = ["runtime"]
# The receive loop, the local store and the uploader. Without it, only the
# `wire` module builds, for targets without the tokio runtime (wasm32).
runtime = ["tokio/full"]

[dependencies]
pgwal = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
postgres-protocol = "0.6"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-postgres = { workspace = true }
